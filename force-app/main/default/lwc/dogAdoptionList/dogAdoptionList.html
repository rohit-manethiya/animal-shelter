<template>
    <lightning-card title="Dogs Available for Adoption" icon-name="utility:animal_and_nature">

        <div slot="actions">
            <lightning-input
                type="search"
                placeholder="Search by name or breed..."
                onchange={handleSearch}
                class="search-input">
            </lightning-input>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading dogs..." size="medium"></lightning-spinner>
                </div>
            </template>
            <template lwc:elseif={hasError}>
                <div class="slds-p-around_medium">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <span class="slds-m-left_x-small slds-text-color_error">{errorMessage}</span>
                </div>
            </template>
            <template lwc:elseif={hasDogs}>
                <!-- Result count + pagination controls -->
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                    <p class="slds-text-body_small slds-text-color_weak">{resultLabel}</p>
                    <div>
                        <lightning-button
                            label="Prev"
                            icon-name="utility:chevronleft"
                            icon-position="left"
                            disabled={isPrevDisabled}
                            onclick={handlePrevPage}>
                        </lightning-button>
                        <lightning-button
                            label="Next"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            disabled={isNextDisabled}
                            onclick={handleNextPage}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </div>
                </div>
                <!-- Dog grid -->
                <div class="dog-grid">
                    <template for:each={dogs} for:item="dog">
                        <div key={dog.Id} class="dog-grid__item">
                            <c-dog-card
                                dog={dog}
                                onrequestadoption={handleAdoptionRequest}>
                            </c-dog-card>
                        </div>
                    </template>
                </div>
            </template>
            <template lwc:else>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <p class="slds-text-color_weak">No dogs available for adoption at the moment.</p>
                </div>
            </template>

        </div>
    </lightning-card>

    <!-- Adoption request modal -->
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 aria-label="Request Adoption"
                 class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeModal}>
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Adopt {selectedDogName}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Your Name"
                        value={adopterName}
                        data-field="adopterName"
                        onchange={handleFieldChange}
                        required>
                    </lightning-input>
                    <lightning-input
                        type="email"
                        label="Email"
                        value={adopterEmail}
                        data-field="adopterEmail"
                        onchange={handleFieldChange}
                        class="slds-m-top_small"
                        required>
                    </lightning-input>
                    <lightning-input
                        type="tel"
                        label="Phone"
                        value={adopterPhone}
                        data-field="adopterPhone"
                        onchange={handleFieldChange}
                        class="slds-m-top_small">
                    </lightning-input>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button
                        label="Submit Request"
                        variant="brand"
                        onclick={submitAdoptionRequest}
                        class="slds-m-left_x-small"
                        disabled={isSubmitting}>
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
