<template>
    <lightning-card icon-name="utility:approval">

        <div slot="title">
            Pending Adoption Requests
            <template lwc:if={hasPending}>
                <lightning-badge label={pendingCount} class="slds-m-left_x-small"></lightning-badge>
            </template>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={hasPending}>
                <div class="sort-controls">
                    <span>Sort:</span>
                    <lightning-button-group>
                        <lightning-button
                            label="Oldest First"
                            variant={oldestVariant}
                            data-sort="asc"
                            onclick={handleSortChange}>
                        </lightning-button>
                        <lightning-button
                            label="Newest First"
                            variant={newestVariant}
                            data-sort="desc"
                            onclick={handleSortChange}>
                        </lightning-button>
                    </lightning-button-group>
                </div>

                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Request #</div></th>
                            <th scope="col"><div class="slds-truncate">Dog</div></th>
                            <th scope="col"><div class="slds-truncate">Adopter</div></th>
                            <th scope="col"><div class="slds-truncate">Email</div></th>
                            <th scope="col"><div class="slds-truncate">Waiting</div></th>
                            <th scope="col"><div class="slds-truncate">Action</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={sortedRequests} for:item="req">
                            <tr key={req.workItemId} class={req.rowClass}>
                                <td><div class="slds-truncate"><strong>{req.name}</strong></div></td>
                                <td>
                                    <div class="slds-truncate">
                                        {req.dogName}
                                        <span class="slds-text-color_weak slds-m-left_xx-small">({req.breed})</span>
                                    </div>
                                </td>
                                <td><div class="slds-truncate">{req.adopterName}</div></td>
                                <td>
                                    <div class="slds-truncate">
                                        <a href="mailto:{req.adopterEmail}">{req.adopterEmail}</a>
                                    </div>
                                </td>
                                <td>
                                    <div class="waiting-cell">
                                        <span class={req.daysBadgeClass}>{req.daysWaitingLabel}</span>
                                    </div>
                                </td>
                                <td>
                                    <div class="action-cell">
                                        <template lwc:if={req.isProcessing}>
                                            <lightning-spinner size="x-small" alternative-text="Processing"></lightning-spinner>
                                        </template>
                                        <template lwc:else>
                                            <lightning-button
                                                label="Approve"
                                                variant="success"
                                                data-id={req.workItemId}
                                                data-action="Approve"
                                                onclick={handleAction}>
                                            </lightning-button>
                                            <lightning-button
                                                label="Reject"
                                                variant="destructive-text"
                                                data-id={req.workItemId}
                                                data-action="Reject"
                                                onclick={handleAction}>
                                            </lightning-button>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template lwc:else>
                <div class="slds-align_absolute-center slds-p-around_medium">
                    <lightning-icon
                        icon-name="utility:check"
                        variant="success"
                        size="small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <span class="slds-text-color_weak">No pending requests — all caught up!</span>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
